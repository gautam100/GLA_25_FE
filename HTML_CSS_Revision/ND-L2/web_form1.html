<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <meta name="description" content="ND L2 batch" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1>Web Form</h1>
    <form method="post">
      <table border="1" width="400px" cellpadding="5" cellspacing="0">
        <tr>
          <td>First name:</td>
          <td>
            <input
              type="text"
              name="user_name"
              placeholder="Enter name"
              required
            />
          </td>
        </tr>
        <tr>
          <td>Email:</td>
          <td>
            <input
              type="email"
              name="user_email"
              placeholder="Enter email"
              required
            />
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <input type="submit" name="submit_btn" value="Submit" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
