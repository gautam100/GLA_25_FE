<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Login Form</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <h1>Login Form</h1>
    <div
      style="
        width: 350px;
        height: 40px;
        border-radius: 15px;
        background-color: yellow;
        display: none;
        border: 1px solid #f7ab13;
        color: red;
        text-align: center;
        padding-top:8px;
      "
      id="global_err"
    ></div>
    <form>
      <table border="0" cellpadding="5" cellspacing="0">
        <tr>
          <td>Email Id</td>
          <td>
            <input type="email" id="user_email" />
            <div id="email_err"></div>
          </td>
        </tr>
        <tr>
          <td>Password</td>
          <td>
            <input type="password" id="user_pwd" minlength="5" maxlength="15" />
            <div id="pwd_err"></div>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <button id="btn" onclick="return chkValidation()">Login</button>
          </td>
        </tr>
      </table>
    </form>
    <script src="form_validation.js"></script>
  </body>
</html>
