<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Grid System</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <div class="row m-2">
                <div class="col border border-primary">Div 1</div>
                <div class="col border border-primary">Div 2</div>
                <div class="col border border-primary">Div 3</div>
            </div>
            <div class="row m-2">
                <div class="col border border-success">Div 1</div>
                <div class="col border border-success">Div 2</div>
                <div class="col border border-danger">Div 3</div>
                <div class="col border border-warning">Div 4</div>
            </div>
            <div class="row m-2">
                <div class="col-md-3 border border-primary">Div 1</div>
                <div class="col-md-6 border border-primary">Div 2</div>
                <div class="col-md-3 border border-primary">Div 3</div>
            </div>
            <div class="row m-2">
                <div class="col-md-2 border border-primary p-3">Div 1</div>
                <div class="col-md-2 border border-primary">Div 2</div>
                <div class="col-md-2 border border-primary">Div 3</div>
                <div class="col-md-2 border border-primary">Div 4</div>
                <div class="col-md-2 border border-primary">Div 5</div>
                <div class="col-md-2 border border-primary">Div 6</div>
                
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
