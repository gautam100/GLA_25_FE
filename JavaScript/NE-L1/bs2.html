<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Grid System</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row m-2">
        <div class="col-md-12 border border-primary">
          <div class="alert alert-primary">Form submitted successfully</div>
          <div class="alert alert-success">Form submitted successfully</div>
          <div class="alert alert-danger">Error in form data</div>
          <div class="alert alert-warning">Form submitted successfully</div>
          <div class="alert alert-secondary">Form submitted successfully</div>
          <div
            class="alert alert-success alert-dismissible fade show"
            role="alert"
          >
            <strong>Holy guacamole!</strong> You should check in on some of
            those fields below.
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>
        </div>
      </div>
      <div class="row m-2">
        <div class="col-md-12 border border-primary p-3">
          <button class="btn btn-primary">Click me!</button>
          <button class="btn btn-secondary">Click me!</button>
          <button class="btn btn-success">Click me!</button>
          <button class="btn btn-danger">Click me!</button>
          <button class="btn btn-warning">Click me!</button>
          <button class="btn btn-info">Click me!</button>
          <button class="btn btn-light">Click me!</button>
          <button class="btn btn-">Click me!</button>
          <button type="button" class="btn btn-outline-success">Success</button>
          <button type="button" class="btn btn-outline-danger">Click</button>
          <button type="button" class="btn btn-outline-primary">Submit</button>
          <button type="button" class="btn btn-outline-warning">Close</button>
          <button type="button" class="btn-close" aria-label="Close"></button>

          <button type="button" class="btn btn-primary position-relative">
            Inbox
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              99+
              <span class="visually-hidden">unread messages</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
