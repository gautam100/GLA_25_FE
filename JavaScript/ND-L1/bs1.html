<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <div class="container">
      <div class="row m-3">
        <div class="col border border-primary">Col 1</div>
        <div class="col border border-primary">Col 2</div>
        <div class="col border border-primary">Col 3</div>
        <div class="col border border-primary">Col 4</div>
      </div>
      <div class="row m-3">
        <div class="col-md-2 border border-success p-3">Div 1</div>
        <div class="col-md-5 border border-success">Div 2</div>
        <div class="col-md-1 border border-success">Div 3</div>
        <div class="col-md-4 border border-success">Div 4</div>
      </div>
      <div class="row m-3">
        <div class="col-md-12 border border-success p-3">
          <div class="alert alert-primary">Form submitted successfully!</div>
          <div class="alert alert-success">Form submitted successfully!</div>
          <div class="alert alert-danger">Form submitted successfully!</div>
          <div class="alert alert-warning">Form submitted successfully!</div>
          <div class="alert alert-secondary">Form submitted successfully!</div>

          <div
            class="alert alert-success alert-dismissible fade show"
            role="alert"
          >
            <strong>Holy guacamole!</strong> You should check in on some of
            those fields below.
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>
        </div>
      </div>

      <div class="row m-3">
        <div class="col-md-12 border border-success p-3">
          <button class="btn btn-primary">Submit</button>
          <button class="btn btn-success">Submit</button>
          <button class="btn btn-danger">Submit</button>
          <button class="btn btn-warning">Submit</button>
          <button class="btn btn-secondary">Submit</button>
          <button type="button" class="btn btn-info">Info</button>

          <button type="button" class="btn btn-outline-primary">Primary</button>
          <button type="button" class="btn btn-outline-danger">Danger</button>
          <button type="button" class="btn btn-outline-warning">Warning</button>
          <button type="button" class="btn-close" aria-label="Close"></button>

          <button type="button" class="btn btn-primary position-relative">
            Inbox
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              99+
              <span class="visually-hidden">unread messages</span>
            </span>
          </button>

          
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src=""></script>
  </body>
</html>
