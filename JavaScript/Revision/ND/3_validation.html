<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Form Validation</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container bg-info p-4">
      <div class="row">
        <div class="col">
          <h1>Sign Up</h1>
          <div class="text-muted">
            Please fill this form to create an account!
          </div>
        </div>
      </div>
      <div class="row mt-4">
        <div id="frm_submit_msg" class="col">
        </div>
      </div>
      <div class="row mt-4">
        <div class="col">
          <input type="text" id="first_name" class="form-control" placeholder="First Name" required />
          <div id="first_name_err" class="text-danger"></div>
        </div>
        <div class="col">
          <input type="text" id="last_name" class="form-control" placeholder="Last Name" required />
          <div id="last_name_err" class="text-danger"></div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col">
          <input type="email" id="email" class="form-control" placeholder="Email" />
          <div id="email_err" class="text-danger"></div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col">
          <input type="password" id="pwd" class="form-control" placeholder="Password" />
          <div id="pwd_err" class="text-danger"></div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col">
          <input
            type="password"
            id="confirm_pwd"
            placeholder="Confirm Password"
            class="form-control"
          />
          <div id="confirm_pwd_err" class="text-danger"></div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col">
          <button onclick="validation()" class="btn btn-success" id="submit_btn">Sign up!</button>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="3_validation.js"></script>
  </body>
</html>
