<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <input type="number" id="user_age" placeholder="Enter age" />
        <br />
        <select id="user_gender">
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        <button id="btn" onclick="serveDrink()">Click!</button>
        <div id="result"></div>
        <script>
            function serveDrink(){
                let age = document.getElementById("user_age").value
                if(age === ""){
                    alert("Pls eneter age!")
                    return "bhagooo"
                }
                let gender = document.getElementById("user_gender").value
                if(age>=18){
                    if(gender === "male"){
                        document.getElementById("result").innerHTML = "<h1>Enjoy your Mojito!</h1>"
                    }else if(gender === "female"){
                        document.getElementById("result").innerHTML = "<h1>Enjoy your Leamon water!</h1>"
                    }else{
                        document.getElementById("result").innerHTML = "<h1>Pls select Gender!</h1>"
                    }
                }else{
                    document.getElementById("result").innerHTML = "<h1>Enjoy your Coke!</h1>"
                }
            }
        </script>
    </body>
</html>
