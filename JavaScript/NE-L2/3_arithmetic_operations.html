<!DOCTYPE html>
<html>
<head>
  <title>Arithmetic operations</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      text-align: center;
    }
    input {
      padding: 8px;
      margin: 5px;
      width: 200px;
      text-align: left;
    }
    button {
      padding: 8px 16px;
      margin: 10px;
      cursor: pointer;
    }
    #result {
      font-weight: bold;
      margin-top: 10px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Arithmetic Operations</h2>

  <form>
    <input type="number" id="num1" placeholder="Enter first number" required>
    <input type="number" id="num2" placeholder="Enter second number" required><br>
    <button type="button" onclick="doAdd()">Add</button>
  </form>

  <div id="result"></div>

  <script>
    	function doAdd(){
		let a = parseInt(document.getElementById("num1").value)
		let b = parseInt(document.getElementById("num2").value)
		sum = 0
		if(validation(a,b)){
			sum = a+b
		}
		document.getElementById("result").innerHTML = "Add is :"+sum
	}
	function validation(first_num="",second_num=""){
		debugger;
		if(first_num === NaN){
			alert("Enter First number!!");
			document.getElementById("num1").focus();
			return false;
		}
		if(second_num === NaN){
			alert("Enter Second number!!");
			document.getElementById("num2").focus();
			return false;
		}
		return true;
	}
  </script>
</body>
</html>
