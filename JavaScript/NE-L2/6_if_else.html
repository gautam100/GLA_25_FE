<!DOCTYPE html>
<html>
<head>
  <title>If-else</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      text-align: center;
    }
    input {
      padding: 8px;
      margin: 5px;
      width: 200px;
      text-align: left;
    }
    button {
      padding: 8px 16px;
      margin: 10px;
      cursor: pointer;
    }
    #result {
      font-weight: bold;
      margin-top: 10px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>WAP in which accept a number and check it is an even number or odd number</h2>

    <input type="number" id="user_age" placeholder="Enter Age" required>
    <button type="button" onclick="chkEvenOdd()"> Check	</button>

  <div id="result">Result</div>

  <script>
  function chkEvenOdd(){
	let age = parseInt(document.getElementById("user_age").value)
    //console.log(typeof age);
	if(age>=18){
		document.getElementById("result").innerHTML = "You are eligible for vote"
	}else{
		document.getElementById("result").innerHTML = "You are not eligible for vote"
	} 
  }
  </script>
</body>
</html>
