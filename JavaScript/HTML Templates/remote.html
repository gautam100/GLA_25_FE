<!DOCTYPE html>
<html>
<head>
  <title>TV Remote Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #333);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      gap: 50px;
    }

    /* Remote Styling */
    .remote {
      background: #111;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .remote h2 {
      color: white;
      margin-bottom: 15px;
    }

    .power {
      background: red;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      cursor: pointer;
      transition: 0.3s;
    }

    .power:hover {
      background: darkred;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      margin-top: 20px;
    }

    button {
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #555;
    }

    /* TV Screen Styling */
    .tv {
      background: #000;
      width: 400px;
      height: 250px;
      border: 10px solid #444;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: limegreen;
      transition: 0.5s;
    }

    .tv.off {
      background: #111;
      color: #333;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <!-- Remote Section -->
  <div class="remote">
    <h2>TV Remote</h2>
    <button class="power" onclick="togglePower()">⏻</button>

    <div class="button-grid">
      <button onclick="pressButton('1')">1</button>
      <button onclick="pressButton('2')">2</button>
      <button onclick="pressButton('3')">3</button>
      <button onclick="pressButton('4')">4</button>
      <button onclick="pressButton('5')">5</button>
      <button onclick="pressButton('6')">6</button>
      <button onclick="pressButton('7')">7</button>
      <button onclick="pressButton('8')">8</button>
      <button onclick="pressButton('9')">9</button>
      <button onclick="pressButton('*')">*</button>
      <button onclick="pressButton('0')">0</button>
      <button onclick="pressButton('#')">#</button>
    </div>
  </div>

  <!-- TV Screen -->
  <div class="tv off" id="tvScreen">TV is OFF</div>

  <script>
    let tvOn = false;

    function togglePower() {
      const screen = document.getElementById("tvScreen");
      tvOn = !tvOn;

      if (tvOn) {
        screen.classList.remove("off");
        screen.innerText = "📺 TV Power ON";
      } else {
        screen.classList.add("off");
        screen.innerText = "TV is OFF";
      }
    }

    function pressButton(value) {
      const screen = document.getElementById("tvScreen");
      if (!tvOn) {
        screen.innerText = "❌ TV is OFF. Please turn it ON.";
        return;
      }
      screen.innerText = `You pressed ${value}`;
    }
  </script>
</body>
</html>
