<!DOCTYPE html>
<html>
<head>
  <title>Arithmetic operations</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      text-align: center;
    }
    input {
      padding: 8px;
      margin: 5px;
      width: 200px;
      text-align: left;
    }
    button {
      padding: 8px 16px;
      margin: 10px;
      cursor: pointer;
    }
    #result {
      font-weight: bold;
      margin-top: 10px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Arithmetic Operations</h2>

  <form>
    <input type="number" id="num1" placeholder="Enter first number" required>
    <input type="number" id="num2" placeholder="Enter second number" required><br>
    <button type="button" onclick="doAdd()">Add</button>
  </form>

  <div id="result">Result is:?</div>

  <script>
    function doAdd(){
	let first_num = parseInt(document.getElementById("num1").value)
	let second_num =  parseInt(document.getElementById("num2").value)
	let sum = 0
	sum = first_num + second_num;
	document.getElementById("result").innerHTML = "Result is: "+sum;

    }
  </script>
</body>
</html>
