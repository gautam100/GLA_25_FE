<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12"><h1>Grid System</h1></div>
      </div>
      <div class="row">
        <div class="col-md-2 col-xs-3 border border-primary p-4">Div 1</div>
        <div class="col-md-2 col-xs-3 border border-success">Div 2</div>
        <div class="col-md-2 col-xs-3 border border-danger">Div 3</div>
        <div class="col-md-2 col-xs-3 border border-warning">Div 4</div>
        <div class="col-md-2 col-xs-3 border border-dark">Div 5</div>
        <div class="col-md-2 col-xs-3 border border-light">Div 6</div>
      </div>
      <div class="row">
        <div class="col-md-3 border border-primary">Div 7</div>
        <div class="col-md-6 border border-primary">Div 8</div>
        <div class="col-md-3 border border-primary">Div 9</div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-6">
          <button class="btn btn-primary">Click Me!</button>
          <button class="btn btn-success">Click Me!</button>
          <button class="btn btn-danger">Click Me!</button>
          <button class="btn btn-warning">Click Me!</button>
          <button class="btn btn-dark">Click Me!</button>
        </div>
        <div class="col-md-6">
          <button type="button" class="btn btn-outline-primary">Primary</button>
          <button type="button" class="btn btn-outline-secondary">
            Secondary
          </button>
          <button type="button" class="btn btn-outline-success">Success</button>
          <button type="button" class="btn btn-outline-danger">Danger</button>
          <button type="button" class="btn btn-outline-warning">Warning</button>
          <button type="button" class="btn btn-outline-info">Info</button>
          <button type="button" class="btn btn-outline-light">Light</button>
          <button type="button" class="btn btn-outline-dark">Dark</button>
        </div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="alert alert-primary">Form submitted succesfully!</div>
          <div class="alert alert-success">Form submitted succesfully!</div>
          <div class="alert alert-danger">Error in user data!</div>
          <div class="alert alert-warning">
            Ther is some notification for you!
          </div>
        </div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-6">
          <button type="button" class="btn btn-success position-relative">
            Inbox
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              99+
              <span class="visually-hidden">unread messages</span>
            </span>
          </button>
        </div>
        <div class="col-md-6">
          
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="" async defer></script>
  </body>
</html>
