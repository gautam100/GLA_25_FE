<!DOCTYPE HTML>
<html>
<head>
	<title> Video & Audio - HTML5</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" href="styles1.css" />
</head>

<body>
<h1>Video & Audio </h1>

<video controls width="400" height="300">
	<source src="./media/ABCD.mp4" />
	<source src="./media/ABCD.ogg" />
	<source src="./media/ABCD.webm" />
	Video tag is not supported by your browser
</video>


<audio controls width="400" height="300">
	<source src="./media/sample-9s.mp3" />
	<source src="./media/sample-9s.wav" />
	<source src="./media/sample-9s.ogg" />
	Audio tag is not supported by your browser
</audio>

</body>
</html>
