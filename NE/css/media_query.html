<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<style>
body{
	background-color:#F7B4B4;
}
.box{
	width:200px;
	height:200px;
	border:1px solid #000;
	overflow-y:auto;
	float:left;
	padding:10px;
	margin:10px;
}

.linear-gradient1{
	background-image : linear-gradient(to top, #CBEACD, #25C600);
}
.linear-gradient2{
	background-image : linear-gradient(to left, red, green);
}
.linear-gradient3{
	background-image : linear-gradient(to right, red, green);
}
.radial-gradient{
	background-image: radial-gradient(#F70000,#F77777,#F7B4B4);
}
.conical-gradient{
	background-image: conic-gradient(#F70000,#F77777,#F7B4B4, #A20000)
}
@media only screen and (max-width:455px){
	body{
	background-color:#A7D883;
	}
	
}

</style>
</head>
<body>
