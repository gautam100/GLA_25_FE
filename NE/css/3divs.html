<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Search engine will display this text with result">
<meta name="keywords" content="Frontend in GLA,HTML in GLA">
<meta name="author" content="Gautam">
<title>Inline CSS</title>
<style>
h1{
	color:red; text-align:center;
}
.my-div{
	width:300px;
	height:300px;
	border: 1px solid #000;
	float:left;
	margin:10px;
	padding: 10px;
	background-color:#F7CCB0;
	background-image: url('./images/shirt1.png');
	background-repeat:no-repeat;
	background-position: center center;
	background-size:cover;
	border-radius:168px;
}
#div4{
	width:92%;
	height:100px;
	border:1px solid green;
	margin:10px;
	padding:15px;
	float:left;
}
</style>
</head>
<body>
<h1>Hello GLA!</h1>
<div id="div1" class="my-div"></div>
<div id="div2" class="my-div"></div>
<div id="div3" class="my-div"></div>
<div id="div4">This is Div4</div>

</body>
</html>
