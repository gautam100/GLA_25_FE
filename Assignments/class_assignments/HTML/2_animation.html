<!DOCTYPE html>
<html>
<head>
  <title>Simple Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
    }

    .ball {
      width: 50px;
      height: 50px;
      background: red;
      border-radius: 50%;
      position: relative;
      animation: bounce 2s infinite;
    }
    .square{
      width: 150px;
      height: 150px;
      background: green;
      position: relative;
      animation: move 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { top: 0; }
      50% { top: 200px; }
    }
    @keyframes move {
      0%, 100% { right: 0; }
      50% { right: 300px; }
    }
  </style>
</head>
<body>
  <div class="ball"></div>
  <div class="square"></div>
</body>
</html>
