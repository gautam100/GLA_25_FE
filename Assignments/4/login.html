<!DOCTYPE HTML>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=0">
	<meta name="description" content="Google look into this content in search results">
	<meta name="keywords" content="HTML in GLA, Frontend in GLA">
	<meta name="author" content="Gautam">
	<title> About Meta Tag</title>
	<style>
	body{
		background-color: #D6C8F3;
	}
	.container{
		width: 500px;
		height:330px;
		background-color:#FFF;
		margin:0px auto;
		border-radius: 24px;
		margin-top: 150px;
	}
	.center{
		text-align:center;
	}
	.row{
		width: 460px;
    		height: 53px;
    		border: 0px solid #000;
    		padding: 8px;
    		margin: 10px;
	}
	.col{
		text-align:center;
	}
	.col div{
		text-align:left;
		margin-left:28px;
		margin-bottom:3px;
	}
	.input-box{
		width:400px;
		height:30px;
		border-radius:12px;
	}
	.btn{
		background-color: #310064;
    		width: 87%;
    		height: 42px;
    		border-radius: 20px;
    		color: #FFF;
	}
	</style>
</head>
<body>
	<div class="container">
		<h1 class="center">Sign in</h1>
		<div class="row">
			<div class="col">
				<div>Email</div>
				<input class="input-box" type="email" id="user_email" placeholder="name@example.com" />
				
			</div>
		</div>
		
		<div class="row">
			<div class="col">
				<div>Password</div>
				<input class="input-box" type="password" id="user_pwd" />
				
			</div>
		</div>

		<div class="row">
			<div class="col">
				<input type="submit" value="Sign in" class="btn" />
				
			</div>
		</div>
	</div>
</body>
</html>
