<!DOCTYPE HTML>
<html>
<head>
<title> Login</title>
<style>
body{
	background-color:#E8B5F7;
}
.container{
	width: 560px;
    	height: 350px;
    	background-color: #FFF;
    	margin: 0px auto;
    	margin-top: 200px;
    	border-radius: 20px;
    	padding-top: 20px;
}
.center{
	text-align:center;
}
.row{
	width: 500px;
	height: 80px;
	border: 0px solid #000;
	margin: 10px 30px;
}
.input-box{
	width:460px;
	height:30px;
	padding:8px;
	border-radius: 20px;
}
.btn{
	width:478px;
	background-color:#010146;
	color: #FFF;
	border-radius:20px;
	height:44px;
}
</style>
</head>
<body>
<div class="container">
<h1 class="center"> Sign in</h1> 

<div class="row">
	<div class="col">
	<div><label>Email</label></div>
	<input class="input-box" type="email" id="user_email" placeholder="name@example.com" />
	</div>
</div>

<div class="row">
	<div class="col">
	<div><label>Password</label></div>
	<input class="input-box" type="password" id="user_pwd" />
	</div>
</div>


<div class="row">
	<div class="col">
	<input class="btn" type="submit" value="Sign in" id="submit_btn" />
	</div>
</div>
</div>
</body>
</html>
